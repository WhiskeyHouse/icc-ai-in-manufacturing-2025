[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
log_cli = 1
log_cli_level = INFO
markers =
    integration: marks tests as integration tests (requires external resources)
    unit: marks tests as unit tests
    slow: marks tests as slow tests 
    e2e: marks tests as end-to-end tests 