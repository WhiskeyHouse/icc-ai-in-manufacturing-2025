## Enable plugins
management.load_definitions = /etc/rabbitmq/definitions.json

## Prometheus plugin configuration
prometheus.return_per_object_metrics = true

## OAuth2 plugin configuration
auth_backends.1 = oauth2
auth_backends.2 = internal

# ## Federation configuration
# federation.local_username = federation_user

## Default RabbitMQ settings
listeners.tcp.default = 5672
management.listener.port = 15672

## Log settings
# log.default = info
log.file.level = info
log.console = true

## Networking settings
loopback_users.guest = false
listeners.ssl.default = 5671

## SSL settings (optional, configure if you need SSL)
# ssl_options.cacertfile = /path/to/cacert.pem
# ssl_options.certfile   = /path/to/cert.pem
# ssl_options.keyfile    = /path/to/key.pem
# ssl_options.verify     = verify_peer
# ssl_options.fail_if_no_peer_cert = true

## OAuth2 settings (example configuration, replace with your actual values)
# oauth2.client_id = your_oauth2_client_id
# oauth2.client_secret = your_oauth2_client_secret
# oauth2.site = https://your-oauth2-provider
# oauth2.redirect_uri = http://localhost:15672/auth/oauth2/callback
# oauth2.authorize_path = /oauth/authorize
# oauth2.token_path = /oauth/token
# oauth2.userinfo_path = /oauth/userinfo
# oauth2.scope = openid profile email

# ## Define the prometheus plugin
# plugins.prometheus.enable = true

## Set log levels
log.default.level = info
log.file = /var/log/rabbitmq/rabbitmq.log

## Management Plugin Configuration
management.listener.ip = 0.0.0.0
management.listener.port = 15672
