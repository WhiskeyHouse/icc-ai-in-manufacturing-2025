version: "3.8"

services:
  test-db:
    image: postgres:12
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "testuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-vector-db:
    build:
      context: ../postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testvectordb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "testuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-app:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      test-db:
        condition: service_healthy
      test-vector-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    environment:
      - ENV=test
      - OPENAI_API_KEY=sk-test-dummy-key
      - DB_HOST=test-db
      - DB_PORT=5432
      - DB_USER=testuser
      - DB_PASSWORD=testpassword
      - MES_DB_NAME=testdb
      - VECTOR_DB_HOST=test-vector-db
      - VECTOR_DB_PORT=5432
      - VECTOR_DB_USER=testuser
      - VECTOR_DB_PASSWORD=testpassword
      - VECTOR_DB_NAME=testvectordb
      - REDIS_HOST=test-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - PRELOAD_INDEXES=false
      - EMBED_MODEL=text-embedding-ada-002
      - DEFAULT_OPENAI_MODEL=gpt-4o-mini
    volumes:
      - ./coverage:/app/coverage
